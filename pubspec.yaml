name: mantra_streak
description: A daily prayer and mantra tracking app for spiritual journey.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  provider: ^6.1.1
  go_router: ^13.0.1
  percent_indicator: ^4.2.3
  supabase_flutter: ^2.3.0
  app_settings: ^5.1.1
  just_audio: ^0.9.40
  app_links: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
